services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command:
      [
        redis-server,
        --appendonly,
        'yes',
        --requirepass,
        '${REDIS_PASSWORD:?Copy .env.example to .env first}',
      ]
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, -a, '${REDIS_PASSWORD:?Copy .env.example to .env first}', ping]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Copy .env.example to .env first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env first}
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    volumes:
      - minio-data:/data

  minio-seed:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: [/bin/sh, -c]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done
        mc mb --ignore-existing local/posha-quarantine
        mc mb --ignore-existing local/posha-private
        mc anonymous set none local/posha-quarantine
        mc anonymous set none local/posha-private
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Copy .env.example to .env first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env first}
    restart: 'no'

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025

  livekit:
    image: livekit/livekit-server:latest
    command: [--dev, --bind, 0.0.0.0]
    ports:
      - 127.0.0.1:7880:7880
      - 127.0.0.1:7881:7881
      - 127.0.0.1:50000-60000:50000-60000/udp
    profiles: [media-dev]

volumes:
  postgres-data:
  redis-data:
  minio-data:
