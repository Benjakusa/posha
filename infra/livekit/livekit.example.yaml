# Production template. Substitute secrets and provision a trusted certificate before use.
port: 7880
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true

redis:
  address: redis.internal:6379
  password: replace-with-a-secret

keys:
  replace-with-livekit-api-key: replace-with-a-random-api-secret

turn:
  enabled: true
  domain: turn.video.example.test
  tls_port: 5349
  udp_port: 3478
  cert_file: /etc/livekit/tls/tls.crt
  key_file: /etc/livekit/tls/tls.key
